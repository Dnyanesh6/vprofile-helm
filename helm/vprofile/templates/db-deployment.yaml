apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb
  labels:
    app: vprodb
spec:
  replicas: {{ .Values.db.replicas }}
  selector:
    matchLabels:
      app: vprodb
  template:
    metadata:
      labels:
        app: vprodb
    spec:
{{- if .Values.dockerregistry.enabled }}
      imagePullSecrets:
        - name: dockerregistry-secret
{{- end }}
      containers:
        - name: vprodb
          image: {{ .Values.db.image }}:{{ .Values.db.tag }}
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: vpro-db-data
          ports:
            - name: vprodb-port
              containerPort: {{ .Values.db.containerPort }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-pass
      volumes:
        - name: vpro-db-data
          persistentVolumeClaim:
            claimName: db-pv-claim
      initContainers:
        - name: cleanup-mysql
          image: {{ .Values.initcontainers.dbCleanImage }}:latest
          command:
            - {{ index .Values.initcontainers.command 0 | quote }}
            - {{ index .Values.initcontainers.command 1 | quote }}
            - {{ .Values.initcontainers.dbCleanupCommand | quote }}
          volumeMounts:
            - name: vpro-db-data
              mountPath: /var/lib/mysql
