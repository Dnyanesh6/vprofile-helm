apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels:
    app: vproapp
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
{{- if .Values.dockerregistry.enabled }}
      imagePullSecrets:
        - name: dockerregistry-secret
{{- end }}
      initContainers:
        - name: init-mydb
          image: {{ .Values.initcontainers.appWaitImage }}:latest
          command:
            - {{ index .Values.initcontainers.command 0 | quote }}
            - {{ index .Values.initcontainers.command 1 | quote }}
            - {{ .Values.initcontainers.appWaitCommand | quote }}
        - name: init-memcache
          image: {{ .Values.initcontainers.appWaitImage }}:latest
          command:
            - {{ index .Values.initcontainers.command 0 | quote }}
            - {{ index .Values.initcontainers.command 1 | quote }}
            - {{ .Values.initcontainers.memcacheWaitCommand | quote }}
      containers:
        - name: vproapp
          image: {{ .Values.app.image }}:{{ .Values.app.tag }}
          imagePullPolicy: Always
          ports:
            - name: vproapp-port
              containerPort: {{ .Values.app.containerPort }}
