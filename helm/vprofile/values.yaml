defaultUser: guest
app:
  image: 563185858851.dkr.ecr.us-east-1.amazonaws.com/vprofileappimg
  tag: d892be3
  replicas: 1
  containerPort: 8080
  servicePort: 8080
db:
  image: dnyaneshchaudhari/vprofiledb
  tag: latest
  replicas: 1
  containerPort: 3306
  servicePort: 3306
  storageClass: gp2
  storageSize: 3Gi
memcached:
  image: memcached
  tag: latest
  replicas: 1
  containerPort: 11211
  servicePort: 11211
rabbitmq:
  image: rabbitmq
  tag: latest
  replicas: 1
  containerPort: 5672
  servicePort: 5672
initcontainers:
  dbCleanImage: busybox
  appWaitImage: busybox
  dbCleanupCommand: rm -rf /var/lib/mysql/lost+found
  appWaitCommand: until nslookup vprodb.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done;
  memcacheWaitCommand: until nslookup vprocache01.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for mydb; sleep 2; done;
  command:
    - sh
    - -c
ingress:
  enabled: true
  host: vprofile.dnyanesh.xyz
  servicePort: 8080
secrets:
  dbPassword: vprodbpass
  rmqPassword: guest
dockerregistry:
  enabled: false
  server: https://index.docker.io/v1/
  username: ""
  password: ""
  email: ""
